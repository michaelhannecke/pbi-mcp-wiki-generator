[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbi-wiki-generator"
version = "0.1.0"
description = "Automatically generate GitHub wiki documentation from Power BI PBIX files using MCP"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = [
    "power-bi",
    "documentation",
    "mcp",
    "model-context-protocol",
    "github-wiki",
    "automation",
    "pbix"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "mcp>=1.0.0",
    "pbixray>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/your-org/pbi-wiki-generator"
Documentation = "https://github.com/your-org/pbi-wiki-generator/wiki"
Repository = "https://github.com/your-org/pbi-wiki-generator.git"
Issues = "https://github.com/your-org/pbi-wiki-generator/issues"

[project.scripts]
pbi-wiki-gen = "generate_wiki:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
